# Phase 12 / step 2 - Scenario 6: a failure with NO class (the honesty check)
#
# WHAT IT TESTS: that a failure outside the vocabulary reports NO class rather than the closest
# plausible one. This step's channelPath points at a channel the AsyncAPI document does not contain,
# so the target cannot be resolved at all - that is a document error, not one of the five runtime
# failures the vocabulary covers.
#
# EXPECTED  POST /run/brokenTarget  ->  HTTP 200
#   "status": "failed"
#   "error":  AsyncAPI target could not be resolved (channel or operation not found)
#   NO "error_class" KEY AT ALL - not empty, ABSENT (it is `omitempty`).
#
# WHY THIS MATTERS: a wrong-but-plausible label is worse than no label, because a client will branch
# on it. "I don't know" has to be expressible, and absence is how it is expressed. Check this one by
# looking at the raw JSON, not a formatted summary - a pretty-printer may hide a missing key.

arazzo: 1.1.0
info:
  title: "Phase 12 - unclassified"
  version: "1.0.0"

sourceDescriptions:
  - name: localBus
    url: ./local.asyncapi.yaml
    type: asyncapi

workflows:
  - workflowId: brokenTarget
    summary: Points at a channel that does not exist
    steps:
      - stepId: emit
        channelPath: localBus#/channels/nosuchchannel
        action: send
        requestBody:
          payload:
            a: 1
